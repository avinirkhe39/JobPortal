{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Login</title>

    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
    

</head>

<body>

<nav class="navbar">

    <div class="logo">
        CareerConnect
    </div>

    <div class="nav-links">

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'register' %}">Register</a>

        <button id="theme-toggle" class="theme-toggle" type="button">
            🌙 Dark
        </button>

    </div>

</nav>


<main class="container">

    <section class="search-box">

        <h1>Welcome Back</h1>

        <p>Login to your CareerConnect account.</p>


        <form method="POST">

            {% csrf_token %}

            {% if messages %}
                {% for message in messages %}
                    <div class="error">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-actions">

                <button type="submit" class="btn search-btn">
                    Login
                </button>

            </div>

        </form>


        <p>
            Don't have an account?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </p>

    </section>

</main>


<script src="{% static 'accounts/theme.js' %}"></script>

</body>

</html>
